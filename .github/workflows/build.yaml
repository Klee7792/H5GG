name: Build H5GG

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      package_type:
        description: 'Package Type'
        required: true
        default: 'both'
        type: choice
        options:
          - dylib
          - deb
          - both

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup THEOS
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --depth=1 https://github.com/theos/theos.git $THEOS
          fi
          # Update theos to download vendor dependencies
          $THEOS/bin/update-theos -f
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          ls -la $THEOS/vendor/

      - name: Setup iOS SDK
        run: |
          export THEOS=$THEOS
          mkdir -p $THEOS/sdks
          # 检查是否已有 SDK 文件（非空目录）
          if [ -z "$(ls -A $THEOS/sdks/ | grep -v .keep)" ]; then
            echo "Downloading iOS SDKs..."
            curl -sL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
            unzip -q /tmp/sdks.zip -d $THEOS/sdks/
            mv $THEOS/sdks/sdks-master/* $THEOS/sdks/
            rm -rf $THEOS/sdks/sdks-master /tmp/sdks.zip
          else
            echo "SDKs already exist, skipping download"
          fi
          echo "=== Available SDKs ==="
          ls -la $THEOS/sdks/

      - name: Install ldid
        run: |
          if ! command -v ldid &> /dev/null; then
            echo "Installing ldid..."
            brew install ldid
          else
            echo "ldid already installed"
          fi

      - name: Prepare build environment
        run: |
          chmod +x ldid-master/*.sh 2>/dev/null || true
          chmod +x ldid-master/ldid.cpp 2>/dev/null || true
          make clean 2>/dev/null || true

      - name: Build Dylib
        if: inputs.package_type == 'dylib' || inputs.package_type == 'both'
        run: |
          if [ '${{ inputs.build_mode }}' == 'debug' ]; then
            make debug
          else
            make
          fi
          echo "=== Dylib Build Output ==="
          ls -la .theos/obj/**/*.dylib 2>/dev/null || find .theos -name "*.dylib" 2>/dev/null || echo "No dylib found"

      - name: Build DEB Package
        if: inputs.package_type == 'deb' || inputs.package_type == 'both'
        run: |
          if [ '${{ inputs.build_mode }}' == 'debug' ]; then
            make package DEBUG=1
          else
            make package
          fi
          echo "=== Package Build Output ==="
          ls -la packages/ 2>/dev/null || echo "No packages directory"

      - name: Collect Output Files
        id: collect
        run: |
          mkdir -p output
          find .theos -name "*.dylib" -exec cp {} output/ \; 2>/dev/null || true
          cp packages/*.deb output/ 2>/dev/null || true
          cp packages/*.tipa output/ 2>/dev/null || true
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h5gg-${{ inputs.build_mode }}-${{ inputs.package_type }}-${{ github.run_number }}
          path: |
            output/*.dylib
            output/*.deb
            output/*.tipa
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## ✅ Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | `${{ inputs.build_mode }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| Package Type | `${{ inputs.package_type }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | `${{ github.run_number }}` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Files:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la output/ 2>/dev/null | tail -n +2 >> $GITHUB_STEP_SUMMARY || echo "No output files found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
